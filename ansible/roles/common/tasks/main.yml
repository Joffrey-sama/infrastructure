---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] }}.yml"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required system packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present

- name: Configure passwordless sudo for ansible_user
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/90-{{ ansible_user | default(ansible_facts['env']['USER'] | default('ansible')) }}" # Use a file name based on the user
    create: true
    mode: '0440'
    owner: root
    group: root
    line: "{{ ansible_user | default(ansible_facts['env']['USER'] | default('ansible')) }} ALL=(ALL) NOPASSWD: ALL"
    validate: 'visudo -cf %s' # Validate syntax before writing
  when: (ansible_become_method | default('sudo')) == 'sudo' and (ansible_user | default('')) != '' # Only apply if using sudo and user defined

- name: Ensure authorized SSH keys are present
  ansible.posix.authorized_key:
    user: "{{ ansible_user | default(ansible_facts['env']['USER'] | default('ansible')) }}"
    state: present
    key: "{{ item }}"
  loop: "{{ authorized_ssh_keys | default([]) }}"


- name: Enable and manage ufw
  community.general.ufw:
    state: enabled
    policy: allow # Default policy for outgoing traffic

- name: Allow incoming SSH traffic for authorized sources
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    from_ip: "{{ item.src | default(item) }}"
    comment: "{{ item.comment | default('Allow SSH access') }}"
  loop: "{{ authorized_ssh_sources | default([]) }}"


- name: Allow incoming HTTP traffic for Gateway LoadBalancer
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
    comment: 'Allow Gateway LoadBalancer HTTP'

- name: Allow incoming HTTPS traffic for Gateway LoadBalancer
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
    comment: 'Allow Gateway LoadBalancer HTTPS'

- name: Allow incoming DNS traffic (TCP)
  community.general.ufw:
    rule: allow
    port: '53'
    proto: tcp
    comment: 'Allow DNS (AdGuard Home)'

- name: Allow incoming DNS traffic (UDP)
  community.general.ufw:
    rule: allow
    port: '53'
    proto: udp
    comment: 'Allow DNS (AdGuard Home)'

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | default(0) > 0
  changed_when: true

- name: Disable swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
    replace: '# \1'

- name: Override Ubuntu kernel blacklist for Intel TCO hardware watchdog
  ansible.builtin.copy:
    dest: /etc/modprobe.d/watchdog.conf
    content: |
      # Override Ubuntu default kernel blacklist for iTCO_wdt
      install iTCO_wdt /sbin/modprobe --ignore-install iTCO_wdt
    owner: root
    group: root
    mode: '0644'
  register: watchdog_modprobe

- name: Ensure watchdog kernel modules are loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/watchdog.conf
    content: |
      iTCO_wdt
      softdog
    owner: root
    group: root
    mode: '0644'
  register: watchdog_modules_load

- name: Update initramfs when watchdog configuration changes
  ansible.builtin.command: update-initramfs -u
  when: (watchdog_modprobe.changed or watchdog_modules_load.changed) and not ansible_check_mode

- name: Load iTCO_wdt hardware watchdog module immediately
  community.general.modprobe:
    name: iTCO_wdt
    state: present
  failed_when: false

- name: Load softdog kernel watchdog module immediately
  community.general.modprobe:
    name: softdog
    state: present
  failed_when: false

- name: Configure systemd hardware/kernel watchdog timers
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?RuntimeWatchdogSec=', line: 'RuntimeWatchdogSec=20s' }
    - { regexp: '^#?RebootWatchdogSec=', line: 'RebootWatchdogSec=30s' }
  register: systemd_watchdog_config

- name: Reload systemd manager configuration to arm watchdog
  ansible.builtin.systemd:
    daemon_reexec: true
  when: systemd_watchdog_config.changed and not ansible_check_mode



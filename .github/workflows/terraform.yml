name: "Terraform CI/CD"

on:
  workflow_dispatch:
  push:
    paths:
      - "terraform/**"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_call:
    inputs:
      module_dir:
        description: "Path to module directory in infrastructure repo (deprecated/optional)"
        required: false
        type: string
        default: ""
      ops_dir:
        description: "Path to environment directory in delva-home-ops repo (e.g. terraform/cluster/oci-oke)"
        required: true
        type: string
      tfvars_file:
        description: "Path to tfvars file relative to ops_dir"
        required: false
        type: string
        default: "prod.tfvars"
      mode:
        description: "Execution mode: 'plan' or 'apply'"
        required: false
        type: string
        default: "plan"
      drain_nodes:
        description: "Whether to drain Kubernetes nodes before cycling (defaults to true; set false for single-node pools)"
        required: false
        type: boolean
        default: true
      runner:
        description: "Runner label or scale set name"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-ci:
    name: "Terraform Lint, Validate & Version Guard"
    if: github.repository == 'Joffrey-sama/infrastructure' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: "Setup TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive terraform/

      - name: "Setup OCI CLI & Validate OKE Version Support"
        if: github.repository == 'Joffrey-sama/infrastructure'
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION || 'eu-paris-1' }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          if [ -n "$OCI_USER_OCID" ] && [ -n "$OCI_PRIVATE_KEY" ]; then
            echo "Configuring OCI credentials..."
            mkdir -p ~/.oci
            printf "[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n" \
              "${OCI_USER_OCID}" "${OCI_FINGERPRINT}" "${OCI_TENANCY_OCID}" "${OCI_REGION}" "${HOME}/.oci/oci_api_key.pem" > ~/.oci/config
            echo "${OCI_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
            chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config

            pip install oci > /dev/null 2>&1 || true
            python3 - << 'PYEOF'
          import os, sys, re, oci
          try:
              config = oci.config.from_file('~/.oci/config', 'DEFAULT')
              ce_client = oci.container_engine.ContainerEngineClient(config)
              options = ce_client.get_cluster_options(cluster_option_id='all').data
              supported_k8s = options.kubernetes_versions
              print(f"Supported OKE Kubernetes versions in {config['region']}: {supported_k8s}")

              var_file = 'terraform/modules/oci-oke/variables.tf'
              with open(var_file, 'r') as f:
                  content = f.read()

              match = re.search(r'variable\s+"kubernetes_version"\s+{[^}]*default\s*=\s*"([^"]+)"', content)
              if match:
                  target_version = match.group(1)
                  print(f"Target OKE version in {var_file}: {target_version}")
                  if target_version not in supported_k8s:
                      print(f"::error file={var_file}::Kubernetes version '{target_version}' is NOT supported by OKE in {config['region']}! Supported versions are: {supported_k8s}")
                      sys.exit(1)
                  else:
                      print(f"SUCCESS: Kubernetes version '{target_version}' is fully supported by OKE!")
          except Exception as e:
              print(f"Error during OCI verification: {e}")
              sys.exit(1)
          PYEOF
          fi

      - name: "Terraform Lint, Validate & Mock Plan for All Modules"
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
        run: |
          TF_BIN=$(which -a terraform | grep -v '_temp' | head -n 1)
          if [ -z "$TF_BIN" ] || [ ! -x "$TF_BIN" ]; then
            TF_BIN="terraform"
          fi
          echo "Resolved Terraform binary: $TF_BIN"

          tflint --init || true

          for mod_dir in terraform/modules/*/; do
            MOD_NAME=$(basename "${mod_dir}")
            echo "============================================================"
            echo "=== Processing module: ${MOD_NAME} (${mod_dir}) ==="
            echo "============================================================"
            pushd "${mod_dir}"

            # 1. Local backend override
            cat <<EOF > backend_override.tf
          terraform {
            backend "local" {
              path = "terraform.tfstate"
            }
          }
          EOF

            # 2. Module-specific test variables
            case "${MOD_NAME}" in
              oci-oke)
                cat <<EOF > mock.tfvars
          compartment_id     = "${OCI_TENANCY_OCID:-ocid1.tenancy.oc1..mock}"
          user_ocid          = "${OCI_USER_OCID:-ocid1.user.oc1..mock}"
          onprem_cpe_ip      = "198.51.100.1"
          onprem_nodes_cidr  = "192.168.1.0/24"
          onprem_pods_cidr   = "10.42.0.0/16"
          vpn_vip            = "10.200.0.1"
          admin_source_cidr  = "198.51.100.1/32"
          EOF
                ;;
              grafana)
                cat <<EOF > mock.tfvars
          grafana_url       = "http://localhost:3000"
          grafana_api_token = "ci-mock-token"
          prometheus_url    = "http://localhost:4000"
          loki_url          = "http://localhost:4000"
          import_dashboards = {}
          EOF
                ;;
            esac

            # 3. Init, Validate & TFLint
            "$TF_BIN" init -reconfigure -input=false
            "$TF_BIN" validate
            tflint

            # 4. Terraform Plan
            if [ -f "mock.tfvars" ]; then
              echo "--- Executing Terraform Plan for ${MOD_NAME} ---"
              set +e
              "$TF_BIN" plan -input=false -lock=false -var-file=mock.tfvars
              PLAN_RC=$?
              set -e
              if [ $PLAN_RC -ne 0 ] && [ $PLAN_RC -ne 2 ]; then
                echo "::error::Terraform plan failed for module ${MOD_NAME} with exit code ${PLAN_RC}"
                exit $PLAN_RC
              fi
              echo "SUCCESS: Plan validated for ${MOD_NAME}."
            fi

            # 5. Cleanup
            rm -f backend_override.tf mock.tfvars terraform.tfstate* .terraform/terraform.tfstate
            popd
          done

      - name: "Guardrail: Check Version Bump on Modified Modules"
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin --tags || true
          git fetch origin main:main || true

          FORK_POINT=$(git merge-base origin/main HEAD)
          MODIFIED_FILES=$(git diff --name-only "$FORK_POINT" HEAD)

          for mod_dir in terraform/modules/*/; do
            if [ -f "${mod_dir}VERSION" ]; then
              MOD_NAME=$(basename "${mod_dir}")
              MOD_VERSION=$(tr -d ' \n\r' < "${mod_dir}VERSION")
              TAG_NAME="tf-${MOD_NAME}-v${MOD_VERSION}"

              if echo "$MODIFIED_FILES" | grep -q "^${mod_dir}"; then
                echo "Module ${MOD_NAME} was modified in this PR. Target tag: ${TAG_NAME}"
                if git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
                  echo "::error file=${mod_dir}VERSION::Version ${MOD_VERSION} for module '${MOD_NAME}' already exists as tag '${TAG_NAME}'. You MUST bump '${mod_dir}VERSION' before merging!"
                  exit 1
                else
                  echo "SUCCESS: Version bump validated for ${MOD_NAME} (v${MOD_VERSION})."
                fi
              fi
            fi
          done

      - name: "Process Modified Modules: Tag & Release"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODIFIED_FILES=$(git diff --name-only HEAD~1 HEAD)

          for mod_dir in terraform/modules/*/; do
            if [ -f "${mod_dir}VERSION" ]; then
              MOD_NAME=$(basename "${mod_dir}")
              MOD_VERSION=$(tr -d ' \n\r' < "${mod_dir}VERSION")
              TAG_NAME="tf-${MOD_NAME}-v${MOD_VERSION}"

              if echo "$MODIFIED_FILES" | grep -q "^${mod_dir}"; then
                echo "--------------------------------------------------"
                echo "Publishing updated Terraform module: ${MOD_NAME} (v${MOD_VERSION}) -> Tag: ${TAG_NAME}"

                if git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
                  echo "::error::Tag ${TAG_NAME} already exists! Cannot overwrite existing release."
                  exit 1
                fi

                echo "Creating Git tag and GitHub Release ${TAG_NAME}..."
                git tag "${TAG_NAME}"
                git push origin "${TAG_NAME}"

                gh release create "${TAG_NAME}" \
                  --title "Release ${TAG_NAME}" \
                  --notes "Terraform module ${MOD_NAME} updated to version ${MOD_VERSION}."
              fi
            fi
          done

  terraform-deploy:
    name: "Terraform Execution (${{ inputs.mode || 'plan' }})"
    if: inputs.ops_dir != ''
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "eu-paris-1"
      AWS_REGION: "eu-paris-1"
      AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"
      TF_IN_AUTOMATION: "true"
      TF_VAR_authentik_token: ${{ secrets.AUTHENTIK_TOKEN }}
      TF_VAR_initial_admin_password: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
      TF_VAR_ldap_bind_password: ${{ secrets.LDAP_BIND_PASSWORD }}
      TF_VAR_grafana_client_secret: ${{ secrets.GRAFANA_CLIENT_SECRET }}
      TF_VAR_headlamp_client_secret: ${{ secrets.HEADLAMP_CLIENT_SECRET }}
      TF_VAR_homarr_client_secret: ${{ secrets.HOMARR_CLIENT_SECRET }}
      TF_VAR_grafana_api_token: ${{ secrets.GRAFANA_API_TOKEN }}
    steps:
      - name: "Checkout Ops Config (Calling Repo)"
        uses: actions/checkout@v4
        with:
          path: ops

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: "Setup OCI CLI & Config"
        if: env.AWS_ACCESS_KEY_ID != '' && env.OCI_USER_OCID != ''
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          printf "[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=eu-paris-1\nkey_file=%s\n" \
            "${OCI_USER_OCID}" "${OCI_FINGERPRINT}" "${OCI_TENANCY_OCID}" "${HOME}/.oci/oci_api_key.pem" > ~/.oci/config
          echo "${OCI_KEY_CONTENT}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config
          which oci || pip install oci-cli > /dev/null 2>&1 || true

      - name: "Terraform Init"
        working-directory: ops/${{ inputs.ops_dir }}
        run: |
          BACKEND_CONF="${GITHUB_WORKSPACE}/ops/${{ inputs.ops_dir }}/backend.hcl"
          if [ -f "$BACKEND_CONF" ]; then
            echo "Using backend config: $BACKEND_CONF"
            terraform init -input=false -backend-config="$BACKEND_CONF"
          else
            echo "ERROR: Backend config not found at $BACKEND_CONF"
            ls -la "${GITHUB_WORKSPACE}/ops" || true
            exit 1
          fi

      - name: "Terraform Plan / Apply"
        working-directory: ops/${{ inputs.ops_dir }}
        run: |
          TFVARS="${GITHUB_WORKSPACE}/ops/${{ inputs.ops_dir }}/${{ inputs.tfvars_file }}"
          MODE="${{ inputs.mode || 'plan' }}"
          if [ "$MODE" = "apply" ]; then
            terraform apply -input=false -auto-approve -var-file="$TFVARS"
          else
            terraform plan -input=false -var-file="$TFVARS"
          fi

      - name: "Cycle Outdated OKE Worker Nodes (Zero-Cost Rolling Update)"
        if: inputs.mode == 'apply' && inputs.ops_dir == 'terraform/cluster/oci-oke'
        working-directory: ops/${{ inputs.ops_dir }}
        env:
          DRAIN_ENABLED: ${{ inputs.drain_nodes }}
        run: |
          echo "=== Starting OKE Worker Node Rotation Check ==="
          NODE_POOL_ID=$(terraform output -raw node_pool_id 2>/dev/null || true)
          if [ -z "$NODE_POOL_ID" ]; then
            echo "No node_pool_id output found, skipping node cycling."
            exit 0
          fi

          echo "Target Node Pool ID: $NODE_POOL_ID"

          # Setup Kubeconfig
          mkdir -p ~/.kube
          terraform output -raw kubeconfig > ~/.kube/config 2>/dev/null || true
          chmod 600 ~/.kube/config

          # Fetch Node Pool Details from OCI
          NODE_POOL_JSON=$(oci ce node-pool get --node-pool-id "$NODE_POOL_ID" --query "data" --output json)
          TARGET_VERSION=$(echo "$NODE_POOL_JSON" | jq -r '."kubernetes-version"')
          echo "Node Pool Target Kubernetes Version: $TARGET_VERSION"

          # Find outdated active nodes
          OUTDATED_NODES=$(echo "$NODE_POOL_JSON" | jq -r --arg TARGET "$TARGET_VERSION" \
            '.nodes[] | select(.["lifecycle-state"] == "ACTIVE" and .["kubernetes-version"] != $TARGET) | "\(.id)|\(.name)|\(.["kubernetes-version"])"')

          if [ -z "$OUTDATED_NODES" ]; then
            echo "All worker nodes are already running the target version ($TARGET_VERSION). No rotation required."
            exit 0
          fi

          TOTAL_ACTIVE_NODES=$(echo "$NODE_POOL_JSON" | jq '[.nodes[] | select(.["lifecycle-state"] == "ACTIVE")] | length')
          echo "Total active nodes in pool: $TOTAL_ACTIVE_NODES"
          echo "Found outdated nodes:"
          echo "$OUTDATED_NODES"

          while IFS="|" read -r NODE_ID NODE_NAME NODE_VER; do
            [ -z "$NODE_ID" ] && continue
            echo "============================================================"
            echo "Rotating Node: $NODE_NAME ($NODE_ID) - Current: $NODE_VER -> Target: $TARGET_VERSION"
            echo "============================================================"

            # Drain logic: only if total active nodes > 1 and DRAIN_ENABLED is true
            if [ "$TOTAL_ACTIVE_NODES" -gt 1 ] && [ "$DRAIN_ENABLED" = "true" ]; then
              echo "Cordoning & Draining node $NODE_NAME..."
              kubectl cordon "$NODE_NAME" || true
              kubectl drain "$NODE_NAME" --ignore-daemonsets --delete-emptydir-data --force --grace-period=60 --timeout=5m || true
            else
              echo "Skipping drain (Total active nodes: $TOTAL_ACTIVE_NODES, Drain enabled: $DRAIN_ENABLED)."
            fi

            echo "Deleting outdated node $NODE_ID from pool (preserving pool size)..."
            oci ce node-pool delete-node --node-pool-id "$NODE_POOL_ID" --node-id "$NODE_ID" --is-decrement-size false --force

            echo "Waiting for replacement node to be provisioned and join the cluster in Ready state..."
            # Wait loop for new node
            MAX_WAIT_SECONDS=900
            ELAPSED=0
            SUCCESS=false

            while [ $ELAPSED -lt $MAX_WAIT_SECONDS ]; do
              sleep 30
              ELAPSED=$((ELAPSED + 30))
              echo "Checking cluster node status ($ELAPSED / $MAX_WAIT_SECONDS s)..."

              # Check if all active nodes in node pool have target version and are ready
              CURRENT_POOL=$(oci ce node-pool get --node-pool-id "$NODE_POOL_ID" --query "data" --output json)
              REPLACING=$(echo "$CURRENT_POOL" | jq -r --arg NID "$NODE_ID" '.nodes[] | select(.id == $NID) | .["lifecycle-state"]')
              
              if [ "$REPLACING" = "DELETED" ] || [ -z "$REPLACING" ]; then
                # Old node is gone, check if a new ready node running target version is present in kubectl
                READY_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -i -v "notready" | grep -i -c "ready" || echo "0")
                echo "Current ready nodes in cluster: $READY_COUNT / $TOTAL_ACTIVE_NODES"
                if [ "$READY_COUNT" -ge "$TOTAL_ACTIVE_NODES" ]; then
                  echo "Replacement node is Ready and joined the cluster!"
                  SUCCESS=true
                  break
                fi
              else
                echo "Old node is currently in state: $REPLACING..."
              fi
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "::warning::Timeout or issue waiting for replacement node after rotating $NODE_NAME."
            else
              echo "Successfully rotated $NODE_NAME."
            fi

          done <<< "$OUTDATED_NODES"

          echo "=== OKE Worker Node Rotation Completed ==="
          kubectl get nodes -o wide || true

name: "Flux CI/CD"

on:
  workflow_dispatch:
    inputs:
      cluster_path:
        description: "Path to cluster root directory in caller repository"
        required: true
        type: string
        default: "kubernetes/clusters/oci-oke"
      target_branch:
        description: "Target branch to compare against"
        required: false
        type: string
        default: "main"
      comment_on_pr:
        description: "Post diff as comment on the pull request"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      cluster_path:
        description: "Path to cluster root directory in caller repository"
        required: true
        type: string
      target_branch:
        description: "Target branch to compare against (e.g. main)"
        required: false
        type: string
        default: "main"
      comment_on_pr:
        description: "Post diff as comment on the pull request"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  flux-diff:
    name: "Flux Diff & Validate"
    runs-on: ubuntu-latest
    env:
      CLUSTER_PATH: ${{ inputs.cluster_path }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: "Setup Flux CLI"
        uses: fluxcd/flux2/action@v2.10.1

      - name: "Setup Helm"
        uses: azure/setup-helm@v5.1.0
        with:
          version: "v4.3.2"

      - name: "Setup Flate"
        uses: home-operations/flate/action@v0.8.0

      - name: "Run Flux Validate & Diff"
        id: diff
        run: |
          set -uo pipefail
          FAILED=false
          TEST_STATUS="✅ Passed"

          echo "::group::flate test"
          if ! flate test --path . > flate_test.log 2>&1; then
            cat flate_test.log
            echo "::error::flate validation failed for ${CLUSTER_PATH}"
            TEST_STATUS="❌ Failed (see workflow logs)"
            FAILED=true
          else
            cat flate_test.log
            if grep -qE "✓ 0 passed|\[UnrelatedFailure\]|\[ExternalSource\]" flate_test.log; then
              echo "::error::flate test skipped resources or emitted UnrelatedFailure/ExternalSource warnings"
              TEST_STATUS="❌ Failed (skipped/warnings)"
              FAILED=true
            fi
          fi
          echo "::endgroup::"

          echo "::group::flate diff"
          if ! flate diff \
              --path . \
              --base "origin/${TARGET_BRANCH}" \
              -o github > diff_flate.txt 2> flate_diff.err; then
            cat flate_diff.err
            echo "::error::flate diff failed for ${CLUSTER_PATH}"
            FAILED=true
          else
            cat flate_diff.err
            if grep -qE "\[UnrelatedFailure\]|\[ExternalSource\]" flate_diff.err; then
              echo "::error::flate diff emitted UnrelatedFailure/ExternalSource warnings"
              FAILED=true
            fi
          fi
          echo "::endgroup::"

          {
            echo "### 🔍 Flux Pre-flight Diff (against ${TARGET_BRANCH})"
            echo ""
            echo "**Cluster path:** \`${CLUSTER_PATH}\` — **Validation:** ${TEST_STATUS}"
            echo ""
            if [ -s diff_flate.txt ]; then
              cat diff_flate.txt
            else
              echo "✅ No changes detected."
            fi
          } > diff_output.md

          cat diff_output.md >> "${GITHUB_STEP_SUMMARY}"
          echo "failed=${FAILED}" >> "${GITHUB_OUTPUT}"

      - name: "Comment Diff on PR"
        if: ${{ !cancelled() && inputs.comment_on_pr && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('diff_output.md')) {
              core.warning('diff_output.md not found, skipping PR comment');
              return;
            }

            // Sticky comment: one comment per cluster path, updated on each push.
            const marker = `<!-- flux-diff:${process.env.CLUSTER_PATH} -->`;
            const MAX_LENGTH = 64000; // GitHub comment hard limit is 65536 chars.
            let body = fs.readFileSync('diff_output.md', 'utf8');
            if (body.length > MAX_LENGTH) {
              body = body.slice(0, MAX_LENGTH) +
                '\n```\n\n</details>\n\n⚠️ Diff truncated, see the workflow job summary for the full output.\n';
            }
            body = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: "Fail on validation or diff errors"
        if: steps.diff.outputs.failed == 'true'
        run: |
          echo "::error::Flux validation or manifest rendering failed for ${CLUSTER_PATH}"
          exit 1

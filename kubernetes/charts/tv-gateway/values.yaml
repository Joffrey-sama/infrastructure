global:
  storageClass: "local-path"

threadfin:
  enabled: false
  image:
    repository: fyb3roptik/threadfin
    tag: "1.2.29"
    pullPolicy: IfNotPresent

  replicas: 1

  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    port: 34400

  httproute:
    enabled: true
    hostname: "tv.internal.example.com"
    gatewayName: "internal-gateway"
    gatewayNamespace: "common-services"

  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  proxy:
    enabled: false
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16"

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi

  config:
    enabled: false
    settings:
      tuner: 1
      epgSource: "XEPG"
      dummy: true
      buffer: "ffmpeg"
      ffmpegForceHttp: false
      ffmpegPath: "/usr/bin/ffmpeg"
    playlists: []
    xmltv: []
    filters: []
    customM3U: []
    curatedRules: []
    logos: {}
    streamOverrides: {}

  extraEnv: []

acestream:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/martinbjeldbak/acestream-http-proxy
    tag: "3.4.0"
    pullPolicy: IfNotPresent
  port: 6878
  torrentPort: 8621
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  gluetun:
    enabled: true
    image:
      repository: qmcgaw/gluetun
      tag: "v3.41.3"
      pullPolicy: IfNotPresent
    vpnServiceProvider: "custom"
    vpnType: "wireguard"
    serverCountries: ""
    wireguardMtu: "1320"
    dnsUpstreamAddresses: "10.128.0.1:53"
    healthTargetAddresses: "10.128.0.1:53"
    localNetwork: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
    outboundSubnets: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
    firewallInputPorts: "6878"
    firewallVpnInputPorts: "8621"
    secret:
      name: "wireguard-conf-secret"
      privateKeyKey: "privateKey"
      presharedKeyKey: "presharedKey"
      publicKeyKey: "publicKey"
    env: {}
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi

scraper:
  enabled: false
  replicas: 1
  image:
    repository: pipepito/acestream-scraper
    tag: "v2.1.0-scraper-acestream-acexy"
    pullPolicy: IfNotPresent
  port: 8000
  httproute:
    enabled: false
    hostname: "scraper.internal.example.com"
    gatewayName: "internal-gateway"
    gatewayNamespace: "common-services"
  podAnnotations: {}
  podLabels: {}
  gluetun:
    enabled: false
    image:
      repository: qmcgaw/gluetun
      tag: "v3.41.3"
      pullPolicy: IfNotPresent
    vpnServiceProvider: "custom"
    vpnType: "wireguard"
    serverCountries: ""
    wireguardMtu: "1320"
    dnsUpstreamAddresses: "10.128.0.1:53"
    healthTargetAddresses: "10.128.0.1:53"
    localNetwork: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
    outboundSubnets: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
    firewallInputPorts: "8000,6878"
    firewallVpnInputPorts: "8621"
    secret:
      name: "wireguard-conf-secret"
      privateKeyKey: "privateKey"
      presharedKeyKey: "presharedKey"
      publicKeyKey: "publicKey"
    env: {}
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []




{{- if and .Values.scraper.enabled .Values.scraper.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tv-gateway.fullname" . }}-scraper
  labels:
    {{- include "tv-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: scraper
spec:
  parentRefs:
    - name: {{ .Values.scraper.httproute.gatewayName | default "internal-gateway" }}
      namespace: {{ .Values.scraper.httproute.gatewayNamespace | default "common-services" }}
  hostnames:
    - {{ .Values.scraper.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "tv-gateway.fullname" . }}-scraper
          port: {{ .Values.scraper.port | default 8000 }}
{{- end }}

{{- if .Values.threadfin.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tv-gateway.fullname" . }}
  labels:
    {{- include "tv-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: threadfin
spec:
  parentRefs:
    - name: {{ .Values.threadfin.httproute.gatewayName | default "internal-gateway" }}
      namespace: {{ .Values.threadfin.httproute.gatewayNamespace | default "common-services" }}
  hostnames:
    - {{ .Values.threadfin.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "tv-gateway.fullname" . }}-threadfin
          port: {{ .Values.threadfin.service.port | default 34400 }}
{{- end }}
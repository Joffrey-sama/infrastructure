{{- if .Values.threadfin.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tv-gateway.fullname" . }}-config
  labels:
    {{- include "tv-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: threadfin
spec:
  accessModes:
    - {{ .Values.threadfin.persistence.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.threadfin.persistence.storageClass | default .Values.global.storageClass | default "local-path" | quote }}
  resources:
    requests:
      storage: {{ .Values.threadfin.persistence.size | default "1Gi" }}
{{- end }}
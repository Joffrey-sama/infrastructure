{{- if and .Values.mosquitto.enabled .Values.mosquitto.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "home-automation.fullname" . }}-mosquitto-data
  labels:
    {{- include "home-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: mosquitto
  {{- with .Values.mosquitto.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.mosquitto.persistence.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.mosquitto.persistence.storageClass | default .Values.global.storageClass | default "local-path" | quote }}
  resources:
    requests:
      storage: {{ .Values.mosquitto.persistence.size | default "1Gi" }}
{{- end }}

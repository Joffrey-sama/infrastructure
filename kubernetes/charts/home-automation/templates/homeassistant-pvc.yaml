{{- if and .Values.homeassistant.enabled .Values.homeassistant.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "home-automation.fullname" . }}-ha-config
  labels:
    {{- include "home-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
spec:
  accessModes:
    - {{ .Values.homeassistant.persistence.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.homeassistant.persistence.storageClass | default .Values.global.storageClass | default "local-path" | quote }}
  resources:
    requests:
      storage: {{ .Values.homeassistant.persistence.size | default "10Gi" }}
{{- end }}

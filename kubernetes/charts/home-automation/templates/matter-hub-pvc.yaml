{{- if and .Values.matterHub.enabled .Values.matterHub.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "home-automation.fullname" . }}-matter-hub-data
  labels:
    {{- include "home-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: matter-hub
spec:
  accessModes:
    - {{ .Values.matterHub.persistence.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.matterHub.persistence.storageClass | default .Values.global.storageClass | default "local-path" | quote }}
  resources:
    requests:
      storage: {{ .Values.matterHub.persistence.size | default "1Gi" }}
{{- end }}

{{- if .Values.homeassistant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "home-automation.fullname" . }}-homeassistant
  labels:
    {{- include "home-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
spec:
  type: {{ .Values.homeassistant.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.homeassistant.service.port | default 8123 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "home-automation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: homeassistant
{{- end }}

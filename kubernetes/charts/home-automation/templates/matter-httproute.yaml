{{- if and .Values.matterServer.enabled .Values.matterServer.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "home-automation.fullname" . }}-matter-server
  labels:
    {{- include "home-automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: matter-server
spec:
  parentRefs:
    - name: {{ .Values.matterServer.route.gatewayName | default "internal-gateway" }}
      namespace: {{ .Values.matterServer.route.gatewayNamespace | default "common-services" }}
  hostnames:
    - {{ .Values.matterServer.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "home-automation.fullname" . }}-matter-server
          port: {{ .Values.matterServer.service.port | default 5580 }}
{{- end }}

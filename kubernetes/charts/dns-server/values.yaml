# Configuration for AdGuard Home chart using bjw-s/app-template
main:
  controllers:
    adguard:
      enabled: true
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 0
        surge: 1
      pod:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9618"

      initContainers:
        init-config:
          image:
            repository: docker.io/library/busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - cp -f /tmp/adguard/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml

      containers:
        main:
          image:
            repository: adguard/adguardhome
            tag: v0.107.56
          env:
            TZ: UTC
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /
              port: 80
            readiness:
              enabled: true
              type: COMMAND
              command:
                - nslookup
                - healthcheck.local
                - 127.0.0.1
              spec:
                initialDelaySeconds: 2
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
            startup:
              enabled: true
              type: HTTP
              path: /
              port: 80
              spec:
                failureThreshold: 30
                periodSeconds: 2

        exporter:
          enabled: true
          image:
            repository: ghcr.io/henrywhitaker3/adguard-exporter
            tag: v1.2.1
          env:
            ADGUARD_SERVERS: "http://127.0.0.1:80"
            ADGUARD_USERNAMES: "none"
            ADGUARD_PASSWORDS: "none"
            INTERVAL: "30s"
            BIND_ADDR: ":9618"
          ports:
            - name: metrics
              containerPort: 9618
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        querylog:
          enabled: true
          image:
            repository: docker.io/library/busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - mkdir -p /opt/adguardhome/work/data && touch /opt/adguardhome/work/data/querylog.json && tail -n 0 -F /opt/adguardhome/work/data/querylog.json
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

  service:
    main:
      controller: adguard
      ports:
        http:
          port: 80
        metrics:
          port: 9618

    dns-tcp:
      controller: adguard
      type: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        metallb.universe.tf/allow-shared-ip: adguard-home
      ports:
        dns-tcp:
          port: 53
          protocol: TCP

    dns-udp:
      controller: adguard
      type: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        metallb.universe.tf/allow-shared-ip: adguard-home
      ports:
        dns-udp:
          port: 53
          protocol: UDP

  route:
    main:
      enabled: false
      parentRefs:
        - name: internal-gateway
          namespace: common-services
      hostnames:
        - "dns.example.com"
      rules:
        - backendRefs:
            - identifier: main
              port: 80

  persistence:
    config:
      enabled: true
      type: emptyDir
      advancedMounts:
        adguard:
          main:
            - path: /opt/adguardhome/conf
          init-config:
            - path: /opt/adguardhome/conf

    data:
      enabled: true
      type: emptyDir
      advancedMounts:
        adguard:
          main:
            - path: /opt/adguardhome/work
          querylog:
            - path: /opt/adguardhome/work

    adguard-config:
      enabled: true
      type: configMap
      identifier: adguard-config
      advancedMounts:
        adguard:
          init-config:
            - path: /tmp/adguard

  configMaps:
    adguard-config:
      data:
        AdGuardHome.yaml: |
          http:
            address: 0.0.0.0:80
            session_ttl: 720h
          users: []
          auth_attempts: 5
          block_auth_min: 15
          http_proxy: ""
          language: ""
          theme: auto
          dns:
            bind_hosts:
              - 0.0.0.0
            port: 53
            anonymize_client_ip: false
            ratelimit: 20
            ratelimit_subnet_len_ipv4: 24
            ratelimit_subnet_len_ipv6: 56
            ratelimit_whitelist: []
            refuse_any: true
            upstream_dns:
              - https://1.1.1.1/dns-query
              - https://1.0.0.1/dns-query
              - https://8.8.8.8/dns-query
              - https://8.8.4.4/dns-query
            upstream_dns_file: ""
            bootstrap_dns:
              - 1.1.1.1
              - 8.8.8.8
              - 1.0.0.1
              - 8.8.4.4
            all_servers: true
            fastest_addr: false
            fastest_timeout: 1s
            allowed_clients: []
            disallowed_clients: []
            blocked_hosts:
              - version.bind
              - id.server
              - hostname.bind
            trusted_proxies:
              - 127.0.0.0/8
              - ::1/128
            cache_size: 4194304
            cache_ttl_min: 0
            cache_ttl_max: 0
            cache_optimistic: false
            bogus_nxdomain: []
            aaaa_disabled: false
            enable_dnssec: false
            edns_client_subnet:
              custom_ip: ""
              enabled: false
              use_custom: false
            max_goroutines: 300
            handle_ddr: true
            ipset: []
            ipset_file: ""
            upstream_timeout: 10s
            private_networks: []
            use_private_ptr_resolvers: true
            local_ptr_upstreams: []
            use_dns64: false
            dns64_prefixes: []
            serve_http3: false
            use_http3_upstreams: false
          tls:
            enabled: false
            server_name: ""
            force_https: false
            port_https: 443
            port_dns_over_tls: 853
            port_dns_over_quic: 853
            port_dnscrypt: 0
            dnscrypt_config_file: ""
            allow_unencrypted_doh: false
            certificate_chain: ""
            private_key: ""
            certificate_path: ""
            private_key_path: ""
            strict_sni_check: false
          querylog:
            enabled: true
            file_enabled: true
            interval: 1h
            size_memory: 1
            ignored:
              - healthcheck.local
          statistics:
            enabled: true
            interval: 24h
            ignored:
              - healthcheck.local
          filters:
            - enabled: true
              url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
              name: AdGuard DNS filter
              id: 1
            - enabled: false
              url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
              name: AdAway Default Blocklist
              id: 2
          whitelist_filters: []
          user_rules: []
          filtering:
            blocking_mode: default
            blocking_ipv4: ""
            blocking_ipv6: ""
            blocked_response_ttl: 10
            filtering_enabled: true
            filters_update_interval: 24
            parental_enabled: false
            safesearch_enabled: false
            safebrowsing_enabled: false
            protection_enabled: true
            rewrites:
              - domain: healthcheck.local
                answer: 127.0.0.1
          dhcp:
            enabled: false
          clients:
            runtime_sources:
              whois: true
              arp: true
              rdns: true
              dhcp: true
              hosts: true
            persistent: []
          log:
            enabled: true
            file: ""
            max_backups: 0
            max_size: 100
            max_age: 3
            compress: false
            local_time: false
            verbose: false
          os:
            group: ""
            user: ""
            rlimit_nofile: 0
          schema_version: 29

global:
  storageClass: "local-path"

postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: bitnami/postgresql
    digest: "sha256:50df5b736a5aea2f1cdb3e2d223f80f30a2353c2514a8e8132945cbc21842944"
  metrics:
    image:
      registry: docker.io
      repository: bitnami/postgres-exporter
      digest: "sha256:7906d7520fc9247181c1abf26d5593bc577508f5caeb5bca1d71f4081bc9c987"
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnami/os-shell
      digest: "sha256:3f93a40e9cfead5252f1fe4913cfab231e33381765f42dc525e52fec7afdeeaf"

provisionDatabases:
  enabled: false
  postgresHost: ""
  podAnnotations: {}
  image: "docker.io/bitnami/postgresql@sha256:8f19ab254c625616febd56dfd2efef45ac74e76fb4e3a4655935faec98736412"
  databases: []

backup:
  enabled: false
  schedule: "0 2 * * *"
  postgresHost: ""
  postgresMasterSecretName: "postgresql-master-secret"
  postgresMasterSecretKey: "postgres-password"
  retentionDays: 30
  rcloneSecretName: ""
  destination: ""
  podAnnotations: {}
  postgresImage:
    repository: "docker.io/bitnami/postgresql"
    tag: ""
    digest: "sha256:50df5b736a5aea2f1cdb3e2d223f80f30a2353c2514a8e8132945cbc21842944"
    pullPolicy: IfNotPresent
  rcloneImage:
    repository: "docker.io/rclone/rclone"
    tag: "1.68.2"
    pullPolicy: IfNotPresent
  resources:
    dump:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    upload:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
